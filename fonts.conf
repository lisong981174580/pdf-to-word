<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- macOS local development paths; missing directories are ignored on Linux. -->
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/Fonts/Supplemental</dir>
  <dir>/Library/Fonts</dir>
  <dir>/usr/share/fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <alias><family>宋体</family><prefer><family>Songti SC</family><family>Noto Serif CJK SC</family></prefer></alias>
  <alias><family>SimSun</family><prefer><family>Songti SC</family><family>Noto Serif CJK SC</family></prefer></alias>
  <alias><family>新宋体</family><prefer><family>Songti SC</family><family>Noto Serif CJK SC</family></prefer></alias>
  <alias><family>黑体</family><prefer><family>Heiti SC</family><family>Noto Sans CJK SC</family></prefer></alias>
  <alias><family>SimHei</family><prefer><family>Heiti SC</family><family>Noto Sans CJK SC</family></prefer></alias>
  <alias><family>微软雅黑</family><prefer><family>PingFang SC</family><family>Noto Sans CJK SC</family></prefer></alias>
  <alias><family>Microsoft YaHei</family><prefer><family>PingFang SC</family><family>Noto Sans CJK SC</family></prefer></alias>
  <alias><family>等线</family><prefer><family>PingFang SC</family><family>Noto Sans CJK SC</family></prefer></alias>
  <alias><family>DengXian</family><prefer><family>PingFang SC</family><family>Noto Sans CJK SC</family></prefer></alias>
  <alias><family>楷体</family><prefer><family>Kaiti SC</family><family>Noto Serif CJK SC</family></prefer></alias>
  <alias><family>KaiTi</family><prefer><family>Kaiti SC</family><family>Noto Serif CJK SC</family></prefer></alias>
  <alias><family>仿宋</family><prefer><family>STFangsong</family><family>Noto Serif CJK SC</family></prefer></alias>
  <alias><family>FangSong</family><prefer><family>STFangsong</family><family>Noto Serif CJK SC</family></prefer></alias>
</fontconfig>
